<svg xmlns="http://www.w3.org/2000/svg" width="720" height="975" viewBox="0 0 720 975" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="975" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">16</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">同一个助手，五种处理</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">校园公开服务问答的纸面推演。</text><rect x="40" y="183" width="640" height="99" rx="17" fill="#def3ed" stroke="#203745" stroke-width="3"/><circle cx="80" cy="233" r="22" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="80" y="242" font-size="27" fill="#203745" font-weight="800" text-anchor="middle">1</text><text x="122" y="221" font-size="29" fill="#203745" font-weight="600" text-anchor="start">本学期周二15点</text><text x="122" y="262" font-size="30" fill="#203745" font-weight="700" text-anchor="start">按常规安排开放</text><rect x="40" y="299" width="640" height="99" rx="17" fill="#e3efff" stroke="#203745" stroke-width="3"/><circle cx="80" cy="349" r="22" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="80" y="358" font-size="27" fill="#203745" font-weight="800" text-anchor="middle">2</text><text x="122" y="337" font-size="29" fill="#203745" font-weight="600" text-anchor="start">本学期周日</text><text x="122" y="378" font-size="30" fill="#203745" font-weight="700" text-anchor="start">按安排闭馆</text><rect x="40" y="415" width="640" height="99" rx="17" fill="#fff1d4" stroke="#203745" stroke-width="3"/><circle cx="80" cy="465" r="22" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="80" y="474" font-size="27" fill="#203745" font-weight="800" text-anchor="middle">3</text><text x="122" y="453" font-size="29" fill="#203745" font-weight="600" text-anchor="start">临时检修</text><text x="122" y="494" font-size="30" fill="#203745" font-weight="700" text-anchor="start">未知，向服务台核实</text><rect x="40" y="531" width="640" height="99" rx="17" fill="#fff1d4" stroke="#203745" stroke-width="3"/><circle cx="80" cy="581" r="22" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="80" y="590" font-size="27" fill="#203745" font-weight="800" text-anchor="middle">4</text><text x="122" y="569" font-size="29" fill="#203745" font-weight="600" text-anchor="start">明年安排</text><text x="122" y="610" font-size="30" fill="#203745" font-weight="700" text-anchor="start">未知，不据本学期外推</text><rect x="40" y="647" width="640" height="99" rx="17" fill="#ffe6de" stroke="#203745" stroke-width="3"/><circle cx="80" cy="697" r="22" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="80" y="706" font-size="27" fill="#203745" font-weight="800" text-anchor="middle">5</text><text x="122" y="685" font-size="29" fill="#203745" font-weight="600" text-anchor="start">同学家庭住址</text><text x="122" y="726" font-size="30" fill="#e76c59" font-weight="700" text-anchor="start">拒绝提供或推测</text><rect x="28" y="833" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="869" font-size="27" fill="#203745" font-weight="500" text-anchor="start">资料不足和隐私越界，</text><text x="48" y="906" font-size="27" fill="#203745" font-weight="500" text-anchor="start">需要不同的处理办法。</text><image href="assets/science-guide.png" x="575" y="806" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="955" font-size="23" fill="#556975" font-weight="500" text-anchor="start">同一组案例复核 · 非独立软件测试</text></svg>