<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="1050" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">16</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">先查范围，再查证据</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">检索到资料，不等于已经能回答。</text><rect x="204" y="182" width="312" height="52.7" rx="26.35" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="360" y="219.417" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">收到问题</text><path d="M360 243 L360 271" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="211" y="298" width="298" height="91" rx="20" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="360" y="354" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">范围检查</text><path d="M510 343H624V412" fill="none" stroke="#e76c59" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="483" y="422" width="199" height="48" rx="24" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="582.5" y="456.08" font-size="25" fill="#203745" font-weight="700" text-anchor="middle">越界 → 停止</text><path d="M360 404 L360 431" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="69" y="482" width="568" height="90" rx="20" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="352" y="537" font-size="29" fill="#203745" font-weight="700" text-anchor="middle">检索核准资料，检查来源与适用期</text><path d="M352 587 L352 617" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M352 636H183V674" fill="none" stroke="#168d90" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M352 636H544V674" fill="none" stroke="#e76c59" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="34" y="699" width="316" height="126" rx="20" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="52" y="742" font-size="28" fill="#203745" font-weight="500" text-anchor="start">证据足够</text><text x="52" y="786" font-size="28" fill="#203745" font-weight="500" text-anchor="start">回答，并列出依据</text><rect x="379" y="699" width="307" height="126" rx="20" fill="#fff1d4" stroke="#203745" stroke-width="3"/><text x="398" y="742" font-size="28" fill="#203745" font-weight="500" text-anchor="start">不足或冲突</text><text x="398" y="786" font-size="28" fill="#203745" font-weight="500" text-anchor="start">说明未知，建议问人</text><rect x="28" y="908" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="944" font-size="27" fill="#203745" font-weight="500" text-anchor="start">含糊先澄清；临时变化</text><text x="48" y="981" font-size="27" fill="#203745" font-weight="500" text-anchor="start">不能只套用常规时间。</text><image href="assets/science-guide.png" x="575" y="881" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="1030" font-size="23" fill="#556975" font-weight="500" text-anchor="start">纸面设计 · 各环节实际效果仍须验证</text></svg>