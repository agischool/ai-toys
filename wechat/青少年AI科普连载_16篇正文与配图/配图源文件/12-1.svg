<svg xmlns="http://www.w3.org/2000/svg" width="720" height="950" viewBox="0 0 720 950" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="950" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">12</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">选模型，别只盯着一个分数</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">三个虚构方案，完成同一批100道题。</text><rect x="39" y="195" width="209" height="358" rx="22" fill="#e3efff" stroke="#203745" stroke-width="3"/><circle cx="144" cy="260" r="40" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="144" y="276" font-size="43" fill="#203745" font-weight="800" text-anchor="middle">A</text><text x="144" y="359" font-size="38" fill="#203745" font-weight="800" text-anchor="middle">80/100</text><text x="144" y="398" font-size="26" fill="#556975" font-weight="500" text-anchor="middle">答对题数</text><text x="144" y="462" font-size="37" fill="#203745" font-weight="700" text-anchor="middle">1秒</text><text x="144" y="518" font-size="37" fill="#203745" font-weight="700" text-anchor="middle">1点</text><rect x="268" y="195" width="209" height="358" rx="22" fill="#def3ed" stroke="#203745" stroke-width="3"/><circle cx="373" cy="260" r="40" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="373" y="276" font-size="43" fill="#203745" font-weight="800" text-anchor="middle">B</text><text x="373" y="359" font-size="38" fill="#203745" font-weight="800" text-anchor="middle">90/100</text><text x="373" y="398" font-size="26" fill="#556975" font-weight="500" text-anchor="middle">答对题数</text><text x="373" y="462" font-size="37" fill="#203745" font-weight="700" text-anchor="middle">4秒</text><text x="373" y="518" font-size="37" fill="#203745" font-weight="700" text-anchor="middle">3点</text><rect x="497" y="195" width="209" height="358" rx="22" fill="#ffe6de" stroke="#203745" stroke-width="3"/><circle cx="602" cy="260" r="40" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="602" y="276" font-size="43" fill="#203745" font-weight="800" text-anchor="middle">C</text><text x="602" y="359" font-size="38" fill="#203745" font-weight="800" text-anchor="middle">92/100</text><text x="602" y="398" font-size="26" fill="#556975" font-weight="500" text-anchor="middle">答对题数</text><text x="602" y="462" font-size="37" fill="#203745" font-weight="700" text-anchor="middle">8秒</text><text x="602" y="518" font-size="37" fill="#203745" font-weight="700" text-anchor="middle">6点</text><rect x="149" y="594" width="422" height="51.15" rx="25.575" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="360" y="630.3165" font-size="33" fill="#203745" font-weight="700" text-anchor="middle">从 B 换到 C</text><text x="124" y="694" font-size="31" fill="#203745" font-weight="500" text-anchor="start">多答对2题，但多等4秒、</text><text x="124" y="738" font-size="31" fill="#203745" font-weight="500" text-anchor="start">多花3点。值不值，要看用途。</text><rect x="28" y="808" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="844" font-size="27" fill="#203745" font-weight="500" text-anchor="start">质量、速度和成本，</text><text x="48" y="881" font-size="27" fill="#203745" font-weight="500" text-anchor="start">要放在一起比较。</text><image href="assets/science-guide.png" x="575" y="781" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="930" font-size="23" fill="#556975" font-weight="500" text-anchor="start">全部数值虚构 · A/B/C不代表参数大小</text></svg>