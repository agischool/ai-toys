<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">11</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">从两格里，读出一个组合</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">连续权重读取，不是随机抽中某一格。</text><rect x="47" y="196" width="248" height="135" rx="20" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="171" y="241" font-size="29" fill="#203745" font-weight="700" text-anchor="middle">位置A</text><text x="171" y="306" font-size="55" fill="#168d90" font-weight="800" text-anchor="middle">2</text><rect x="428" y="196" width="248" height="135" rx="20" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="551" y="241" font-size="29" fill="#203745" font-weight="700" text-anchor="middle">位置B</text><text x="551" y="306" font-size="55" fill="#e76c59" font-weight="800" text-anchor="middle">10</text><path d="M171 348V437H295V513" fill="none" stroke="#168d90" stroke-width="17" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M551 348V437H425V513" fill="none" stroke="#e76c59" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="52" y="370" width="225" height="48" rx="24" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="164.5" y="404.08" font-size="30" fill="#203745" font-weight="700" text-anchor="middle">权重 0.75</text><rect x="445" y="370" width="225" height="48" rx="24" fill="#fff1d4" stroke="#203745" stroke-width="3"/><text x="557.5" y="404.08" font-size="30" fill="#203745" font-weight="700" text-anchor="middle">权重 0.25</text><circle cx="360" cy="569" r="89" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="360" y="591" font-size="69" fill="#203745" font-weight="800" text-anchor="middle">4</text><text x="360" y="721" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">2×0.75＋10×0.25＝4</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">读出的4是加权组合，</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">不等于存储里原有的2或10。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">数值示意 · 不是NTM的完整结构</text></svg>