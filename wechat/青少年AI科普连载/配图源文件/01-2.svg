<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">01</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">答得自信，也可能认错</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">看看这次送进来的，究竟是什么。</text><rect x="40" y="185" width="280" height="265" rx="20" fill="#ffe6de" stroke="#203745" stroke-width="3"/><g transform="translate(177,296) scale(1.2)"><path d="M-62 10 L-60 -60 L-25 -36 Q0 -52 26 -36 L60 -60 L64 12 Q55 65 0 64 Q-56 60 -62 10Z" fill="#8d82d8" stroke="#203745" stroke-width="5"/><path d="M-46 -36 L-44 -13 L-26 -26 M44 -36 L44 -13 L26 -26" fill="#e76c59"/><circle cx="-24" cy="9" r="6" fill="#203745"/><circle cx="24" cy="9" r="6" fill="#203745"/><path d="M-7 27 L7 27 L0 34 Z M0 34 Q-12 48 -21 37 M0 34 Q12 48 21 37" fill="none" stroke="#203745" stroke-width="4"/><path d="M-44 29 L-83 22 M-43 40 L-82 45 M44 29 L83 22 M43 40 L82 45" stroke="#203745" stroke-width="3"/><path d="M-42 -12 L-28 -6 M-38 -19 L-34 0" stroke="#203745" stroke-width="3"/></g><text x="180" y="423" font-size="26" fill="#556975" font-weight="500" text-anchor="middle">模糊的毛绒玩具</text><rect x="370" y="195" width="290" height="114" rx="20" fill="#fff1d4" stroke="#203745" stroke-width="3"/><text x="388" y="235" font-size="28" fill="#203745" font-weight="500" text-anchor="start">只让我选猫或狗？</text><text x="388" y="279" font-size="28" fill="#203745" font-weight="500" text-anchor="start">那我选……猫！</text><image href="assets/science-guide.png" x="423" y="323" width="145" height="145" preserveAspectRatio="xMidYMid meet"/><path d="M338 369 L376 369" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="44" y="508" font-size="32" fill="#203745" font-weight="600" text-anchor="start">二选一的程序仍可能给出高分</text><rect x="44" y="545" width="632" height="127" rx="20" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="65" y="590" font-size="32" fill="#203745" font-weight="600" text-anchor="start">猫</text><rect x="120" y="567" width="420" height="32" rx="14" fill="#168d90" stroke="none" stroke-width="3"/><text x="614" y="597" font-size="42" fill="#168d90" font-weight="800" text-anchor="middle">0.9</text><text x="65" y="640" font-size="32" fill="#203745" font-weight="600" text-anchor="start">狗</text><rect x="120" y="617" width="47" height="32" rx="14" fill="#e76c59" stroke="none" stroke-width="3"/><text x="614" y="647" font-size="42" fill="#e76c59" font-weight="800" text-anchor="middle">0.1</text><rect x="145" y="700" width="432" height="48" rx="24" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="361" y="734.08" font-size="28" fill="#203745" font-weight="700" text-anchor="middle">输入已经超出约定范围</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">先检查输入是否适合任务，</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">再看分数有多高。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">假设情景 · 并非真实模型测试</text></svg>