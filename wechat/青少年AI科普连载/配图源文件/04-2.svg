ext><text x="37" y="359" font-size="32" fill="#203745" font-weight="600" text-anchor="start">总绝对误差</text><rect x="30" y="420" width="160" height="92" rx="10" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="110" y="400" font-size="60" fill="#e76c59" font-weight="800" text-anchor="middle">6</text><text x="110" y="464" font-size="33" fill="#203745" font-weight="700" text-anchor="middle">b＝0</text><rect x="250" y="520" width="160" height="92" rx="10" fill="#fff1d4" stroke="#203745" stroke-width="3"/><text x="330" y="500" font-size="60" fill="#203745" font-weight="800" text-anchor="middle">3</text><text x="330" y="564" font-size="33" fill="#203745" font-weight="700" text-anchor="middle">b＝1</text><rect x="470" y="620" width="160" height="92" rx="10" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="550" y="600" font-size="60" fill="#168d90" font-weight="800" text-anchor="middle">0</text><text x="550" y="664" font-size="33" fill="#203745" font-weight="700" text-anchor="middle">b＝2</text><path d="M206 430 L237 465" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M426 530 L457 565" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">损失从6降到3，再到0。</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">这里用的是手动试数。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">简化算例 · 不作为梯度下降推导</text></svg>