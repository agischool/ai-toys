<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">08</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">把新文字，接回下一轮</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">上一轮的结果，会成为下一轮的线索。</text><rect x="162" y="183" width="396" height="48" rx="24" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="360" y="217.07999999999998" font-size="28" fill="#203745" font-weight="700" text-anchor="middle">已有文字（第一轮：我）</text><path d="M352 281 L352 321" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="164" y="347" width="390" height="99" rx="20" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="359" y="409" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">计算概率 → 选择一片</text><path d="M352 460 L352 497" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="136" y="521" width="217" height="80" rx="9" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="244.5" y="575.4" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">我</text><rect x="361" y="521" width="217" height="80" rx="9" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="469.5" y="575.4" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">画画</text><path d="M584 566H663V241H455" fill="none" stroke="#e76c59" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="627" y="448" font-size="26" fill="#e76c59" font-weight="600" text-anchor="start">再</text><text x="627" y="482" font-size="26" fill="#e76c59" font-weight="600" text-anchor="start">来</text><text x="627" y="516" font-size="26" fill="#e76c59" font-weight="600" text-anchor="start">一</text><text x="627" y="550" font-size="26" fill="#e76c59" font-weight="600" text-anchor="start">轮</text><path d="M352 613 L352 642" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="114" y="665" width="483" height="49.6" rx="24.8" fill="#fff1d4" stroke="#203745" stroke-width="3"/><text x="355.5" y="700.216" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">下一步接句号：我画画。</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">没到停止条件，就继续。</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">本例特别约定遇到句号停止。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">本例只查最后一片 · 真实模型可看更长上下文</text></svg>