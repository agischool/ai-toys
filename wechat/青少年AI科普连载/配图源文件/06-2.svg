<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">06</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">输入动一点，两条路各出力</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">把输入从2调到2.1：增加了0.1。</text><rect x="147" y="183" width="426" height="60.45" rx="30.225" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="360" y="225.9195" font-size="39" fill="#203745" font-weight="700" text-anchor="middle">输入：2 → 2.1</text><path d="M246 245 L180 305" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M473 245 L543 305" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="43" y="327" width="293" height="237" rx="20" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="189" y="373" font-size="33" fill="#203745" font-weight="700" text-anchor="middle">直通路径</text><text x="189" y="445" font-size="39" fill="#203745" font-weight="700" text-anchor="middle">2 → 2.1</text><text x="189" y="526" font-size="44" fill="#168d90" font-weight="800" text-anchor="middle">＋0.1</text><rect x="379" y="327" width="298" height="237" rx="20" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="528" y="373" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">F：乘以0.5</text><text x="528" y="445" font-size="38" fill="#203745" font-weight="700" text-anchor="middle">1 → 1.05</text><text x="528" y="526" font-size="44" fill="#e76c59" font-weight="800" text-anchor="middle">＋0.05</text><path d="M189 580 L313 635" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M528 580 L409 635" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="97" y="664" width="526" height="48.050000000000004" rx="24.025000000000002" fill="#fff1d4" stroke="#203745" stroke-width="3"/><text x="360" y="698.1155" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">总变化：0.1＋0.05＝0.15</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">两路的变化在相加处汇合。</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">新输出：3 → 3.15。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">线性算例 · 变化也可能抵消</text></svg>