<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="1050" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">10</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">下一片文字，怎样算出来？</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">沿一种简化的生成型Transformer走一遍。</text><rect x="72" y="188" width="210" height="64" rx="9" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="177" y="231.52" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">今天</text><rect x="290" y="188" width="210" height="64" rx="9" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="395" y="231.52" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">下雨</text><path d="M515 220 L590 220" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="640" y="231" font-size="50" fill="#e76c59" font-weight="800" text-anchor="middle">…</text><rect x="66" y="295" width="588" height="100" rx="20" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="360" y="335" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">① token编号 → 嵌入</text><text x="360" y="374" font-size="30" fill="#203745" font-weight="500" text-anchor="middle">再引入位置信息</text><path d="M360 408 L360 436" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="66" y="463" width="588" height="247" rx="20" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="360" y="503" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">② 多个Transformer块</text><text x="360" y="548" font-size="32" fill="#168d90" font-weight="800" text-anchor="middle">因果多头自注意力</text><text x="360" y="590" font-size="28" fill="#203745" font-weight="500" text-anchor="middle">残差相加 → 归一化</text><text x="360" y="637" font-size="32" fill="#168d90" font-weight="800" text-anchor="middle">前馈网络</text><text x="360" y="679" font-size="28" fill="#203745" font-weight="500" text-anchor="middle">残差相加 → 归一化</text><path d="M360 721 L360 750" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="47" y="777" width="625" height="48" rx="24" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="359.5" y="811.08" font-size="30" fill="#203745" font-weight="700" text-anchor="middle">③ 候选分数 → 概率 → 选下一片</text><rect x="28" y="908" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="944" font-size="27" fill="#203745" font-weight="500" text-anchor="start">先取得表示，再结合前文，</text><text x="48" y="981" font-size="27" fill="#203745" font-weight="500" text-anchor="start">最后选择下一片文字。</text><image href="assets/science-guide.png" x="575" y="881" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="1030" font-size="23" fill="#556975" font-weight="500" text-anchor="start">仅展示解码器流程及一种归一化顺序</text></svg>