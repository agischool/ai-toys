<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">15</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">有链接，就有证据了吗？</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">核查主张：本校图书馆本周日开放。</text><circle cx="109" cy="251" r="55" fill="#e3efff" stroke="#203745" stroke-width="7"/><path d="M147.5 289.5l35 35" stroke="#e76c59" stroke-width="16" stroke-linecap="round"/><rect x="235" y="194" width="419" height="131" rx="20" fill="#fff1d4" stroke="#203745" stroke-width="3"/><text x="255" y="244" font-size="31" fill="#203745" font-weight="500" text-anchor="start">先确认：本校公告</text><text x="255" y="288" font-size="31" fill="#203745" font-weight="500" text-anchor="start">并且适用于本周</text><rect x="42" y="369" width="636" height="103" rx="18" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="62" y="411" font-size="30" fill="#203745" font-weight="600" text-anchor="start">公告写“周日开放”</text><text x="614" y="449" font-size="32" fill="#168d90" font-weight="800" text-anchor="end">支持</text><rect x="42" y="493" width="636" height="103" rx="18" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="62" y="535" font-size="30" fill="#203745" font-weight="600" text-anchor="start">公告写“周日闭馆”</text><text x="614" y="573" font-size="32" fill="#e76c59" font-weight="800" text-anchor="end">相矛盾</text><rect x="42" y="617" width="636" height="103" rx="18" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="62" y="659" font-size="30" fill="#203745" font-weight="600" text-anchor="start">只列周一至周五</text><text x="614" y="697" font-size="32" fill="#168d90" font-weight="800" text-anchor="end">证据不足</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">可靠网站上的材料，</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">也要逐句看是否支持主张。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">公告与主张均为构造示例</text></svg>