<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">11</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">地址没变，内容换了</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">把外部存储想成五个编号抽屉。</text><text x="42" y="201" font-size="31" fill="#203745" font-weight="600" text-anchor="start">① 写入“红、蓝、黄”</text><rect x="40" y="223" width="112" height="94" rx="12" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="96" y="251" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">1号</text><text x="96" y="289" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">红</text><path d="M77 305h38" stroke="#203745" stroke-width="4"/><rect x="172" y="223" width="112" height="94" rx="12" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="228" y="251" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">2号</text><text x="228" y="289" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">蓝</text><path d="M209 305h38" stroke="#203745" stroke-width="4"/><rect x="304" y="223" width="112" height="94" rx="12" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="360" y="251" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">3号</text><text x="360" y="289" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">黄</text><path d="M341 305h38" stroke="#203745" stroke-width="4"/><rect x="436" y="223" width="112" height="94" rx="12" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="492" y="251" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">4号</text><text x="492" y="289" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">空</text><path d="M473 305h38" stroke="#203745" stroke-width="4"/><rect x="568" y="223" width="112" height="94" rx="12" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="624" y="251" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">5号</text><text x="624" y="289" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">空</text><path d="M605 305h38" stroke="#203745" stroke-width="4"/><rect x="135" y="344" width="452" height="48.050000000000004" rx="24.025000000000002" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="361" y="378.1155" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">② 读取2号 → 返回“蓝”</text><text x="42" y="450" font-size="31" fill="#203745" font-weight="600" text-anchor="start">③ 第2格用“绿”覆盖</text><rect x="40" y="472" width="112" height="94" rx="12" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="96" y="500" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">1号</text><text x="96" y="538" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">红</text><path d="M77 554h38" stroke="#203745" stroke-width="4"/><rect x="172" y="472" width="112" height="94" rx="12" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="228" y="500" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">2号</text><text x="228" y="538" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">绿</text><path d="M209 554h38" stroke="#203745" stroke-width="4"/><rect x="304" y="472" width="112" height="94" rx="12" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="360" y="500" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">3号</text><text x="360" y="538" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">黄</text><path d="M341 554h38" stroke="#203745" stroke-width="4"/><rect x="436" y="472" width="112" height="94" rx="12" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="492" y="500" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">4号</text><text x="492" y="538" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">空</text><path d="M473 554h38" stroke="#203745" stroke-width="4"/><rect x="568" y="472" width="112" height="94" rx="12" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="624" y="500" font-size="23" fill="#556975" font-weight="500" text-anchor="middle">5号</text><text x="624" y="538" font-size="32" fill="#203745" font-weight="700" text-anchor="middle">空</text><path d="M605 554h38" stroke="#203745" stroke-width="4"/><rect x="135" y="601" width="452" height="48.050000000000004" rx="24.025000000000002" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="361" y="635.1155" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">④ 再读2号 → 返回“绿”</text><text x="360" y="718" font-size="32" fill="#203745" font-weight="600" text-anchor="middle">读一次，不会把记录拿走。</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">没保存历史版本，</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">就不能从2号找回旧的“蓝”。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">离散读写规则示意 · 非真实模型实验</text></svg>