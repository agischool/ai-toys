<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">08</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">选最高分，还是抽一张？</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">开头给定“我”，下一片有两种选择。</text><rect x="43" y="181" width="296" height="119" rx="20" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="191" y="226" font-size="36" fill="#203745" font-weight="700" text-anchor="middle">读书</text><text x="191" y="279" font-size="43" fill="#168d90" font-weight="800" text-anchor="middle">0.6</text><rect x="378" y="181" width="296" height="119" rx="20" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="526" y="226" font-size="36" fill="#203745" font-weight="700" text-anchor="middle">画画</text><text x="526" y="279" font-size="43" fill="#e76c59" font-weight="800" text-anchor="middle">0.4</text><rect x="41" y="325" width="635" height="48" rx="24" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="358.5" y="359.08" font-size="30" fill="#203745" font-weight="700" text-anchor="middle">贪心：每步选最高 → 我读书。</text><text x="43" y="408" font-size="30" fill="#203745" font-weight="600" text-anchor="start">采样：10张卡片，等机会抽1张</text><rect x="44" y="429" width="110" height="79" rx="13" fill="#def3ed" stroke="#203745" stroke-width="3"/