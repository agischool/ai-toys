<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="1050" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">07</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">读到结尾，红伞还在吗？</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">同一段故事，可以留下不同的记录。</text><g transform="translate(139,263) scale(0.82)"><path d="M-70 0 Q0 -100 70 0 Q48 -22 24 0 Q0 -22 -24 0 Q-48 -22 -70 0Z" fill="#e76c59" stroke="#203745" stroke-width="4"/><path d="M0 -54 V70 Q0 95 -22 80" fill="none" stroke="#203745" stroke-width="6" stroke-linecap="round"/></g><path d="M310 272q-30-36 2-54q15-35 46-12q47-14 52 26q33 2 22 40Z" fill="#e3efff" stroke="#203745" stroke-width="4"/><path d="M518 225h100q25 0 10-24 M500 254h150q20 0 10 22 M528 294h60" fill="none" stroke="#168d90" stroke-width="6" stroke-linecap="round"/><text x="139" y="375" font-size="26" fill="#556975" font-weight="500" text-anchor="middle">出门</text><text x="362" y="375" font-size="26" fill="#556975" font-weight="500" text-anchor="middle">天阴</text><text x="594" y="375" font-size="26" fill="#556975" font-weight="500" text-anchor="middle">起风</text><rect x="33" y="416" width="283" height="48" rx="24" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="174.5" y="450.08" font-size="28" fill="#203745" font-weight="700" text-anchor="middle">只留最新一句</text><rect x="48" y="491" width="186" height="70" rx="9" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="141" y="538.6" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">红伞</text><rect x="242" y="491" width="186" height="70" rx="9" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="335" y="538.6" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">天阴</text><rect x="436" y="491" width="186" height="70" rx="9" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="529" y="538.6" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">起风</text><text x="365" y="614" font-size="34" fill="#e76c59" font-weight="700" text-anchor="middle">问颜色 → 无法知道</text><rect x="33" y="658" width="283" height="48" rx="24" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="174.5" y="692.08" font-size="28" fill="#203745" font-weight="700" text-anchor="middle">专门保留颜色</text><rect x="48" y="727" width="186" height="70" rx="9" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="141" y="774.6" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">红</text><rect x="242" y="727" width="186" height="70" rx="9" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="335" y="774.6" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">红</text><rect x="436" y="727" width="186" height="70" rx="9" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="529" y="774.6" font-size="34" fill="#203745" font-weight="700" text-anchor="middle">红</text><text x="365" y="848" font-size="34" fill="#168d90" font-weight="700" text-anchor="middle">问颜色 → 红色</text><rect x="28" y="908" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="944" font-size="27" fill="#203745" font-weight="500" text-anchor="start">便签只作类比。真实RNN</text><text x="48" y="981" font-size="27" fill="#203745" font-weight="500" text-anchor="start">传递的是一组数值状态。</text><image href="assets/science-guide.png" x="575" y="881" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="1030" font-size="23" fill="#556975" font-weight="500" text-anchor="start">人为设定的记录规则 · 不是模型实测</text></svg>