xt x="166" y="469" font-size="30" fill="#203745" font-weight="700" text-anchor="middle">新写入量</text><text x="166" y="516" font-size="38" fill="#e76c59" font-weight="800" text-anchor="middle">1</text><path d="M166 548 L326 587" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M515 548 L394 587" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="360" cy="590" r="27" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="360" y="602" font-size="32" fill="#203745" font-weight="800" text-anchor="middle">＋</text><rect x="121" y="642" width="478" height="51.15" rx="25.575" fill="#fff1d4" stroke="#203745" stroke-width="3"/><text x="360" y="678.3165" font-size="33" fill="#203745" font-weight="700" text-anchor="middle">新状态：2×0.5＋1＝2</text><text x="360" y="753" font-size="32" fill="#203745" font-weight="600" text-anchor="middle">改为0.9：2×0.9＋1＝2.8</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">结果同样是2，</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">不代表中间什么都没发生。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">乘加关系示意 · 非完整LSTM</text></svg>