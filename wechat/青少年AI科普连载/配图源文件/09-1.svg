<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">09</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">这个“它”，究竟指谁？</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">小球没放进盒子，因为……</text><rect x="35" y="184" width="650" height="242" rx="20" fill="#e3efff" stroke="#203745" stroke-width="3"/><circle cx="120" cy="304" r="68" fill="#e76c59" stroke="#203745" stroke-width="3"/><rect x="306" y="260" width="100" height="112" rx="8" fill="#fff1d4" stroke="#203745" stroke-width="3"/><path d="M309 263L323 240H392L406 263" fill="#ffc857" stroke="#203745" stroke-width="3"/><path d="M200 311 L274 311" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="450" y="226" width="211" height="72" rx="20" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="468" y="266" font-size="28" fill="#203745" font-weight="500" text-anchor="start">它太大了</text><text x="563" y="377" font-size="28" fill="#e76c59" font-weight="700" text-anchor="middle">通常指小球</text><rect x="35" y="463" width="650" height="242" rx="20" fill="#fff1d4" stroke="#203745" stroke-width="3"/><circle cx="120" cy="583" r="47" fill="#e76c59" stroke="#203745" stroke-width="3"/><rect x="306" y="584" width="58" height="67" rx="8" fill="#fff1d4" stroke="#203745" stroke-width="3"/><path d="M309 587L323 564H350L364 587" fill="#ffc857" stroke="#203745" stroke-width="3"/><path d="M200 590 L274 590" stroke="#203745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="450" y="505" width="211" height="72" rx="20" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="468" y="545" font-size="28" fill="#203745" font-weight="500" text-anchor="start">它太小了</text><text x="563" y="656" font-size="28" fill="#168d90" font-weight="700" text-anchor="middle">通常指盒子</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">一个字变了，通常理解也变。</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">额外背景仍可能改变解释。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">句意示意 · 不是模型注意力的测量结果</text></svg>