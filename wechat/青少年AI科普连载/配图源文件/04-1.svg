<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" viewBox="0 0 9 9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" stroke="#203745" stroke-width="1.7" fill="none"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect width="720" height="930" rx="28" fill="#fffdf7"/><path d="M26 108H694" stroke="#203745" stroke-width="3"/><rect x="28" y="22" width="78" height="48" rx="24" fill="#168d90" stroke="#203745" stroke-width="3"/><text x="67" y="56.08" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">04</text><text x="128" y="62" font-size="40" fill="#203745" font-weight="800" text-anchor="start">训练时，拧的是哪个旋钮？</text><text x="30" y="145" font-size="28" fill="#556975" font-weight="500" text-anchor="start">模型形式固定：预测值＝输入值＋b。</text><rect x="42" y="184" width="286" height="128" rx="20" fill="#e3efff" stroke="#203745" stroke-width="3"/><text x="62" y="224" font-size="34" fill="#203745" font-weight="500" text-anchor="start">输入不变</text><text x="62" y="268" font-size="34" fill="#203745" font-weight="500" text-anchor="start">1、2、3</text><rect x="366" y="184" width="312" height="128" rx="20" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="387" y="224" font-size="34" fill="#203745" font-weight="500" text-anchor="start">目标不变</text><text x="387" y="268" font-size="34" fill="#203745" font-weight="500" text-anchor="start">3、4、5</text><circle cx="360" cy="492" r="127" fill="#fff1d4" stroke="#203745" stroke-width="3"/><circle cx="360" cy="492" r="79" fill="#ffc857" stroke="#203745" stroke-width="3"/><text x="360" y="518" font-size="76" fill="#203745" font-weight="800" text-anchor="middle">b</text><path d="M360 483L404 432" fill="none" stroke="#e76c59" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="234" y="427" font-size="38" fill="#203745" font-weight="800" text-anchor="middle">0</text><text x="360" y="351" font-size="38" fill="#203745" font-weight="800" text-anchor="middle">1</text><text x="489" y="427" font-size="38" fill="#203745" font-weight="800" text-anchor="middle">2</text><rect x="131" y="669" width="458" height="62" rx="31" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="360" y="713.02" font-size="40" fill="#203745" font-weight="700" text-anchor="middle">b：0 → 1 → 2</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">输入和答案不动，</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">三个预测会随着b一起变化。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">原理示意 · 数值由本文设定</text></svg>