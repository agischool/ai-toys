745" stroke-width="3"/><text x="618" y="379" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">255</text><text x="42" y="443" font-size="32" fill="#203745" font-weight="600" text-anchor="start">sRGB 每通道8位</text><rect x="47" y="477" width="80" height="61" rx="13" fill="#ff0000" stroke="#203745" stroke-width="3"/><text x="159" y="519" font-size="30" fill="#203745" font-weight="600" text-anchor="start">红</text><text x="299" y="519" font-size="34" fill="#203745" font-weight="600" text-anchor="start">(255, 0, 0)</text><rect x="47" y="564" width="80" height="61" rx="13" fill="#0000ff" stroke="#203745" stroke-width="3"/><text x="159" y="606" font-size="30" fill="#203745" font-weight="600" text-anchor="start">蓝</text><text x="299" y="606" font-size="34" fill="#203745" font-weight="600" text-anchor="start">(0, 0, 255)</text><rect x="47" y="651" width="80" height="61" rx="13" fill="#ffffff" stroke="#203745" stroke-width="3"/><text x="159" y="693" font-size="30" fill="#203745" font-weight="600" text-anchor="start">白</text><text x="299" y="693" font-size="34" fill="#203745" font-weight="600" text-anchor="start">(255, 255, 255)</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">3×3 的 RGB 小图：</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">3×3×3＝27个通道数值。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">这里不含透明度等额外通道</text></svg>