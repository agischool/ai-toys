"#e76c59" font-weight="800" text-anchor="middle">×</text><rect x="160" y="469" width="396" height="48.050000000000004" rx="24.025000000000002" fill="#def3ed" stroke="#203745" stroke-width="3"/><text x="358" y="503.1155" font-size="31" fill="#203745" font-weight="700" text-anchor="middle">优先答对题数 → 选B</text><rect x="40" y="553" width="640" height="179" rx="20" fill="#ffe6de" stroke="#203745" stroke-width="3"/><text x="63" y="605" font-size="35" fill="#203745" font-weight="600" text-anchor="start">关卡二：2秒内返回</text><text x="65" y="658" font-size="29" fill="#203745" font-weight="600" text-anchor="start">A合格；B超时；C超时且超预算</text><text x="360" y="709" font-size="43" fill="#168d90" font-weight="800" text-anchor="middle">只剩 A</text><rect x="28" y="788" width="664" height="92" rx="20" fill="#def3ed" stroke="none" stroke-width="3"/><text x="48" y="824" font-size="27" fill="#203745" font-weight="500" text-anchor="start">“最好”的方案，</text><text x="48" y="861" font-size="27" fill="#203745" font-weight="500" text-anchor="start">也要能满足实际限制。</text><image href="assets/science-guide.png" x="575" y="761" width="118" height="118" preserveAspectRatio="xMidYMid meet"/><text x="30" y="910" font-size="23" fill="#556975" font-weight="500" text-anchor="start">虚构选型示例 · 真实耗时并非固定值</text></svg>