<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>青少年 AI 科普连载素材</title><style>html,body{margin:0;padding:0;background:#fffdf6}main{width:fit-content}</style><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2100" viewBox="0 0 1440 2100" style="display:block;font-family:'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arrow" viewBox="0 0 30 30" refX="25" refY="15" markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M4 3 L25 15 L4 27" fill="none" stroke="#203845" stroke-width="6"/></marker></defs><rect width="1440" height="2100" rx="52" fill="#fffdf6"/><rect x="56" y="44" width="156" height="98" rx="54" fill="#168f94" stroke="#203845" stroke-width="6"/><text x="134" y="64" font-size="54" fill="#ffffff" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="134" dy="0">04</tspan></text><text x="255" y="60" font-size="72" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="255" dy="0">同一批题，能检查什么</tspan></text><path d="M54,215 L1386,215" fill="none" stroke="#203845" stroke-width="6" stroke-linecap="round"/><text x="60" y="247" font-size="49" fill="#586e79" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="60" dy="0">改过的题再跑一遍，不是独立新证据。</tspan></text><g data-node="true"><rect x="100" y="400" width="540" height="220" rx="38" fill="#e3efff" stroke="#203845" stroke-width="6"/><text x="370" y="443.24" font-size="52" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="370" dy="0">开发案例 × 6</tspan><tspan x="370" dy="71.75999999999999">用来发现和修复错误</tspan></text></g><polyline points="370,642 370,790" fill="none" stroke="#203845" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g data-node="true"><rect x="100" y="820" width="540" height="220" rx="38" fill="#def3ee" stroke="#203845" stroke-width="6"/><text x="370" y="864.62" font-size="51" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="370" dy="0">修改规则</tspan><tspan x="370" dy="70.38">重跑属于回归检查</tspan></text></g><polyline points="370,1062 370,1210" fill="none" stroke="#203845" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g data-node="true"><rect x="100" y="1240" width="540" height="220" rx="38" fill="#fff1d2" stroke="#203845" stroke-width="6"/><text x="370" y="1291.52" font-size="46" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="370" dy="0">记录每例结果</tspan><tspan x="370" dy="63.48">成功、恰当停止、错完成</tspan></text></g><g data-node="true"><rect x="800" y="400" width="540" height="220" rx="38" fill="#fff1d2" stroke="#203845" stroke-width="6"/><text x="1070" y="444.62" font-size="51" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="1070" dy="0">预先保留案例 × 6</tspan><tspan x="1070" dy="70.38">不据这些题修改规则</tspan></text></g><polyline points="1070,642 1070,790" fill="none" stroke="#203845" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g data-node="true"><rect x="800" y="820" width="540" height="220" rx="38" fill="#def3ee" stroke="#203845" stroke-width="6"/><text x="1070" y="864.62" font-size="51" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="1070" dy="0">方案确定后检查</tspan><tspan x="1070" dy="70.38">再看新条件下的结果</tspan></text></g><polyline points="1070,1062 1070,1210" fill="none" stroke="#203845" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g data-node="true"><rect x="800" y="1240" width="540" height="220" rx="38" fill="#ffe7df" stroke="#203845" stroke-width="6"/><text x="1070" y="1288.76" font-size="48" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="1070" dy="0">若据结果又修改</tspan><tspan x="1070" dy="66.24">需另补新的保留案例</tspan></text></g><text x="720" y="1630" font-size="44" fill="#586e79" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">本地公开的两组案例，都只作规则程序回归。</tspan></text><rect x="56" y="1840" width="1328" height="180" rx="42" fill="#def3ee" stroke="#def3ee" stroke-width="0"/><text x="96" y="1870" font-size="49" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="96" dy="0">开发检查与保留检查分开；</tspan><tspan x="96" dy="67.61999999999999">公开规则成绩不是模型成功率。</tspan></text><image href="../../../.site/assets/serial-robot.png" x="1152" y="1785" width="245" height="245" preserveAspectRatio="xMidYMid meet"/><text x="60" y="2050" font-size="32" fill="#586e79" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="60" dy="0">两组各1例任务成功、5例恰当停止；故意错误建议另列</tspan></text></svg></main></body></html>
