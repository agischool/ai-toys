<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>青少年 AI 科普连载素材</title><style>html,body{margin:0;padding:0;background:#fffdf6}main{width:fit-content}</style><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2100" viewBox="0 0 1440 2100" style="display:block;font-family:'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arrow" viewBox="0 0 30 30" refX="25" refY="15" markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M4 3 L25 15 L4 27" fill="none" stroke="#203845" stroke-width="6"/></marker></defs><rect width="1440" height="2100" rx="52" fill="#fffdf6"/><rect x="56" y="44" width="156" height="98" rx="54" fill="#168f94" stroke="#203845" stroke-width="6"/><text x="134" y="64" font-size="54" fill="#ffffff" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="134" dy="0">02</tspan></text><text x="255" y="60" font-size="72" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="255" dy="0">少算的计算，多留的空间</tspan></text><path d="M54,215 L1386,215" fill="none" stroke="#203845" stroke-width="6" stroke-linecap="round"/><text x="60" y="247" font-size="49" fill="#586e79" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="60" dy="0">先数清处理位置，再数保存的数值。</tspan></text><text x="70" y="385" font-size="51" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="70" dy="0">逐个追加12个位置，K投影分别处理：</tspan></text><text x="70" y="540" font-size="48" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="70" dy="0">重算</tspan></text><rect x="280" y="520" width="1000" height="115" rx="20" fill="#ee6a58" stroke="#203845" stroke-width="6"/><text x="1350" y="550" font-size="56" fill="#203845" text-anchor="end" dominant-baseline="hanging" font-weight="650"><tspan x="1350" dy="0">78</tspan></text><text x="70" y="735" font-size="48" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="70" dy="0">缓存</tspan></text><rect x="280" y="715" width="153.84615384615384" height="115" rx="20" fill="#168f94" stroke="#203845" stroke-width="6"/><text x="490" y="745" font-size="56" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="490" dy="0">12</tspan></text><text x="720" y="950" font-size="50" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">1＋2＋…＋12＝78　　只追加：12</tspan></text><text x="720" y="1050" font-size="46" fill="#586e79" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">V投影另算一份，计数也是78与12。</tspan></text><g data-node="true"><rect x="130" y="1210" width="1180" height="330" rx="38" fill="#e3efff" stroke="#203845" stroke-width="6"/><text x="720" y="1270.29" font-size="53" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">缓存空间：K 和 V 两组</tspan><tspan x="720" dy="73.14">2 × 12 × 16 × 8 = 3,072字节</tspan><tspan x="720" dy="73.14">单层、宽度16、每个数8字节</tspan></text></g><rect x="56" y="1840" width="1328" height="180" rx="42" fill="#def3ee" stroke="#def3ee" stroke-width="0"/><text x="96" y="1870" font-size="49" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="96" dy="0">78÷12 不是提速6.5倍。</tspan><tspan x="96" dy="67.61999999999999">本例没有测设备运行时间。</tspan></text><image href="../../../.site/assets/serial-robot.png" x="1152" y="1785" width="245" height="245" preserveAspectRatio="xMidYMid meet"/><text x="60" y="2050" font-size="32" fill="#586e79" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="60" dy="0">只计K/V数组净负载；不等于整机内存或总运算量</tspan></text></svg></main></body></html>
