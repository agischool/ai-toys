nd="url(#arrow)"/><text x="250" y="755" font-size="48" fill="#ee6a58" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="250" dy="0">没有</tspan></text><text x="1050" y="755" font-size="48" fill="#168f94" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="1050" dy="0">有</tspan></text><g data-node="true"><rect x="80" y="885" width="560" height="240" rx="38" fill="#ffe7df" stroke="#203845" stroke-width="6"/><text x="360" y="910.64" font-size="48" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="360" dy="0">先检查整理过程</tspan><tspan x="360" dy="66.24">截断、摘要或检索</tspan><tspan x="360" dy="66.24">哪一步漏了条件？</tspan></text></g><g data-node="true"><rect x="790" y="885" width="570" height="240" rx="38" fill="#def3ee" stroke="#203845" stroke-width="6"/><text x="1075" y="910.64" font-size="48" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="1075" dy="0">再看最终建议</tspan><tspan x="1075" dy="66.24">回答是否满足</tspan><tspan x="1075" dy="66.24">坡道这一要求？</tspan></text></g><polyline points="1075,1150 1075,1300" fill="none" stroke="#203845" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g data-node="true"><rect x="650" y="1330" width="710" height="240" rx="38" fill="#fff1d2" stroke="#203845" stroke-width="6"/><text x="1005" y="1383.24" font-size="52" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="1005" dy="0">保留条件 ≠ 用对条件</tspan><tspan x="1005" dy="71.75999999999999">还需另外检查任务结果</tspan></text></g><text x="80" y="1410" font-size="47" fill="#586e79" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="80" dy="0">本地程序能检查</tspan><tspan x="80" dy="64.86">要求有没有被保留。</tspan></text><rect x="56" y="1840" width="1328" height="180" rx="42" fill="#def3ee" stroke="#def3ee" stroke-width="0"/><text x="96" y="1870" font-size="49" fill="#203845" text-anchor="start" dominant-ba
