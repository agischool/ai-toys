<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>青少年 AI 科普连载素材</title><style>html,body{margin:0;padding:0;background:#fffdf6}main{width:fit-content}</style><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2100" viewBox="0 0 1440 2100" style="display:block;font-family:'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arrow" viewBox="0 0 30 30" refX="25" refY="15" markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M4 3 L25 15 L4 27" fill="none" stroke="#203845" stroke-width="6"/></marker></defs><rect width="1440" height="2100" rx="52" fill="#fffdf6"/><rect x="56" y="44" width="156" height="98" rx="54" fill="#168f94" stroke="#203845" stroke-width="6"/><text x="134" y="64" font-size="54" fill="#ffffff" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="134" dy="0">02</tspan></text><text x="255" y="60" font-size="72" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="255" dy="0">查到时间，还要查什么</tspan></text><path d="M54,215 L1386,215" fill="none" stroke="#203845" stroke-width="6" stroke-linecap="round"/><text x="60" y="247" font-size="49" fill="#586e79" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="60" dy="0">下一步使用前一步返回的场地编号。</tspan></text><g data-node="true"><rect x="180" y="370" width="1080" height="170" rx="38" fill="#fff1d2" stroke="#203845" stroke-width="6"/><text x="720" y="385.48" font-size="54" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">任务：周二15—16点</tspan><tspan x="720" dy="74.52">投影仪、有坡道，只给建议</tspan></text></g><polyline points="720,562 720,630" fill="none" stroke="#203845" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g data-node="true"><rect x="130" y="660" width="1180" height="180" rx="38" fill="#e3efff" stroke="#203845" stroke-width="6"/><text x="720" y="684.62" font-size="51" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">第1次｜查时间：S1、S2</tspan><tspan x="720" dy="70.38">V1、V2 都是周二15—17点开放</tspan></text></g><polyline points="720,862 720,930" fill="none" stroke="#203845" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g data-node="true"><rect x="200" y="960" width="1040" height="180" rx="38" fill="#def3ee" stroke="#203845" stroke-width="6"/><text x="720" y="979.1" font-size="55" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">第2次｜读 V1 详情：E1</tspan><tspan x="720" dy="75.89999999999999">投影仪：有　坡道：有</tspan></text></g><polyline points="720,1162 720,1230" fill="none" stroke="#203845" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g data-node="true"><rect x="165" y="1260" width="1110" height="200" rx="38" fill="#def3ee" stroke="#203845" stroke-width="6"/><text x="720" y="1291.86" font-size="53" fill="#203845" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">时期与时间 ✓　设备 ✓　坡道 ✓</tspan><tspan x="720" dy="73.14">建议 V1 科学活动室</tspan></text></g><text x="720" y="1590" font-size="52" fill="#586e79" text-anchor="middle" dominant-baseline="hanging" font-weight="650"><tspan x="720" dy="0">S1 + E1 支持建议；没有进行预约。</tspan></text><rect x="56" y="1840" width="1328" height="180" rx="42" fill="#def3ee" stroke="#def3ee" stroke-width="0"/><text x="96" y="1870" font-size="49" fill="#203845" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="96" dy="0">两次查询补齐不同条件。</tspan><tspan x="96" dy="67.61999999999999">记录变多，要带来新证据。</tspan></text><image href="../../../.site/assets/serial-robot.png" x="1152" y="1785" width="245" height="245" preserveAspectRatio="xMidYMid meet"/><text x="60" y="2050" font-size="32" fill="#586e79" text-anchor="start" dominant-baseline="hanging" font-weight="650"><tspan x="60" dy="0">固定规
